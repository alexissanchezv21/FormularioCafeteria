<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetería Feku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="fondo-pantalla d-flex justify-content-center align-items-center min-vh-100">

    <div class="contenedor-principal shadow-lg p-4 rounded-4 w-100" style="max-width: 600px;">
        
        <header class="encabezado d-flex justify-content-between align-items-center p-3 rounded-top-3 mb-4">
            <h1 class="titulo m-0">Cafetería Feku</h1>
            <div class="imagen-contenedor">
                <img src="Imagenes/oso.png" alt="Oso Feku" class="imagen">
            </div>
        </header>

        <form id="formulario" class="cuerpo-formulario" action="http://localhost:3000/pedido" method="POST">
            
            <div class="grupo-entrada mb-3">
                <label for="nombre" class="form-label fw-bold">Nombre:</label>
                <input type="text" id="nombre" name="nombre" class="form-control entrada-texto">
            </div>

            <div class="grupo-entrada mb-3">
                <label for="correoElectronico" class="form-label fw-bold">Correo electrónico:</label>
                <input type="email" id="correoElectronico" name="correoElec" class="form-control entrada-texto">
            </div>

            <div class="grupo-entrada mb-3">
                <label for="produc" class="form-label fw-bold">Producto:</label>
                <select name="productos" id="produc" class="form-select entrada-texto">
                    <option value="">Selecciona el producto</option>
                    <option value="Expresso">Expresso</option>
                    <option value="Americano">Americano</option>
                    <option value="Cappuccino">Cappuccino</option>
                    <option value="Latte">Latte</option>
                    <option value="Moka">Moka</option>
                </select>
            </div>

            <div class="grupo-entrada mb-3">
                <label for="cantidad" class="form-label fw-bold">Cantidad:</label>
                <input type="number" id="cantidad" name="cantidad" min="1" max="100" step="1" class="form-control entrada-texto">
            </div>

            <div class="grupo-entrada mb-3">
                <label class="form-label fw-bold d-block">Tamaño:</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="tamanio" id="tamanioChico" value="Chico">
                    <label class="form-check-label" for="tamanioChico">Chico (8 oz)</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="tamanio" id="tamanioMediano" value="Mediano">
                    <label class="form-check-label" for="tamanioMediano">Mediano (12 oz)</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="tamanio" id="tamanioGrande" value="Grande">
                    <label class="form-check-label" for="tamanioGrande">Grande (16 oz)</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="tamanio" id="tamanioExtra" value="Extra grande">
                    <label class="form-check-label" for="tamanioExtra">Extra grande (20 oz)</label>
                </div>
            </div>

            <div class="grupo-entrada mb-3 form-check">
                <input type="checkbox" id="llevar" name="llevar" value="Si" class="form-check-input">
                <label class="form-check-label fw-bold" for="llevar">Pedido para llevar</label>
            </div>

            <div class="grupo-entrada mb-4">
                <label for="observaciones" class="form-label fw-bold">Observaciones:</label>
                <textarea id="observaciones" name="observacion" rows="3" class="form-control entrada-texto" placeholder="Escriba aquí..."></textarea>
            </div>

            <div class="botones d-flex gap-3 justify-content-center">
                <button type="reset" class="btn btn-limpiar px-4 py-2">Limpiar</button>
                <button type="submit" class="btn btn-registrar px-4 py-2">Registrar pedido</button>

            </div>

        </form>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
